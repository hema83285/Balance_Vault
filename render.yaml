services:
  - type: web
    name: balancevault-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci --include=dev && npx prisma generate
    startCommand: node server.js
    healthCheckPath: /health
    initialDeployHook: npx prisma db push
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://${{balancevault-web.host}}

  - type: web
    name: balancevault-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci --include=dev && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://${{balancevault-api.host}}/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
