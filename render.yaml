services:
  - type: web
    name: balancevault-api
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm ci --include=dev && npx prisma generate
    startCommand: node server.js
    healthCheckPath: /health
    initialDeployHook: npx prisma db push
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: balancevault-api-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: balancevault-api-db
    plan: free
    region: oregon
